name: Refresh blog posts

# Keeps blog/posts.json in sync with the Substack feed automatically.
on:
  schedule:
    # Runs at 06:00, 14:00, and 22:00 UTC every day (3x daily).
    - cron: '0 6,14,22 * * *'
  workflow_dispatch: {}   # allows a manual run from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-blog
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate blog/posts.json from Substack feed
        run: node .github/scripts/refresh-blog-posts.mjs

      - name: Commit and push if changed
        # Never fail the run on a commit/push hiccup. The committed snapshot
        # keeps the blog working, so a missed refresh is harmless. Exiting
        # cleanly here is what stops the "Run failed" notification emails.
        run: |
          if [ -n "$(git status --porcelain blog/posts.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add blog/posts.json
            git commit -m "Auto-refresh blog posts from Substack feed" || { echo "Nothing to commit."; exit 0; }
            # Rebase on any concurrent changes, then push. Tolerate failure.
            git pull --rebase --autostash origin main || echo "Rebase skipped."
            if git push; then
              echo "posts.json updated and pushed."
            else
              echo "Push failed (will retry next scheduled run); not failing the job."
            fi
          else
            echo "No changes to posts.json."
          fi
